<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Frames: Wave Motion vs Gas Flow</title>
<style>
  :root{
    --navy:#232D4B; --orange:#E57200; --ice:#EEF2F8; --cream:#FBEEE0;
    --green:#2E7D32; --muted:#5b6478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#fff; color:var(--navy);
    font-family:Calibri,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px; margin:0 auto; padding:22px 20px 34px;}
  h1{
    font-family:"Bookman Old Style",Georgia,serif;
    font-size:26px; margin:0 0 2px; letter-spacing:.2px;
  }
  .eyebrow{
    display:inline-block; background:var(--orange); color:#fff;
    font-weight:700; font-size:12px; letter-spacing:1.5px;
    padding:5px 14px; border-radius:20px; margin-bottom:12px;
  }
  .sub{color:var(--muted); font-size:16px; margin:0 0 16px; min-height:22px;}
  .sub b{color:var(--navy);}
  .stage{
    position:relative; width:100%; border:1px solid #dfe4ee;
    border-radius:14px; overflow:hidden; background:var(--ice);
  }
  canvas{display:block; width:100%; height:auto;}
  .controls{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    margin-top:16px;
  }
  button.toggle{
    background:var(--navy); color:#fff; border:none; cursor:pointer;
    font-family:Calibri,sans-serif; font-size:16px; font-weight:700;
    padding:12px 22px; border-radius:10px; transition:background .15s;
  }
  button.toggle:hover{background:#31406b;}
  .frametag{font-size:15px; color:var(--muted);}
  .frametag b{color:var(--orange); font-size:16px;}
  .takeaway{
    margin-top:16px; padding:14px 18px; background:var(--cream);
    border-left:4px solid var(--orange); border-radius:6px;
    font-size:15.5px; line-height:1.5; min-height:24px;
  }
  .foot{margin-top:14px; color:#93a; color:var(--muted); font-size:12.5px;}
  .foot span{color:var(--navy); font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">THE PHYSICAL PICTURE</span>
  <h1>Reference Frames: Wave Motion vs Gas Flow</h1>
  <p class="sub" id="subtitle"></p>

  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <div class="controls">
    <button class="toggle" id="btn">切换到波固定系 ▶</button>
    <div class="frametag">Current:&nbsp;<b id="frameName">Ground frame</b></div>
  </div>

  <div class="takeaway" id="takeaway"></div>

  <p class="foot">
    MAE 2030 · Speed of Sound &nbsp;|&nbsp;
    Molecular thermal speed <span>~460 m/s &gt;&gt; a</span> — only the bulk drift on top of thermal motion is drawn ·
    <span>da exaggerated</span> (infinitesimal in reality)
  </p>
</div>

<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const btn = document.getElementById('btn');
  const frameName = document.getElementById('frameName');
  const subtitle = document.getElementById('subtitle');
  const takeaway = document.getElementById('takeaway');

  const COL = {
    navy:'#232D4B', orange:'#E57200', ice:'#EEF2F8', cream:'#FBEEE0',
    green:'#2E7D32', muted:'#5b6478', mol:'#2f3b5e', molC:'#1d2740'
  };

  // logical drawing size
  let W = 920, H = 430, DPR = 1;
  function resize(){
    const cssW = cv.parentNode.clientWidth;
    W = cssW; H = Math.round(cssW * 0.47);
    DPR = window.devicePixelRatio || 1;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // --- state ---
  // f = 0 ground frame, f = 1 wave frame
  let f = 0, fTarget = 0;
  const aPix = 150;          // wave speed / inflow speed in px/s (screen scale)
  const daFrac = 0.15;       // slowdown fraction across band (exaggerated)
  let bandX = 0.5;           // band position as fraction of W (ground: drifts left)
  let last = performance.now();

  // molecules
  const N = 150;
  const mols = [];
  function seed(){
    mols.length = 0;
    for(let i=0;i<N;i++){
      const x = Math.random();
      mols.push({
        x: x,                          // 0..1 fraction of W
        y: 0.14 + Math.random()*0.72,  // fraction of H
        ph: Math.random()*Math.PI*2,   // jiggle phase
        pv: 0.6 + Math.random()*0.9,   // jiggle freq
        amp: 2.2 + Math.random()*2.4,  // jiggle amplitude px
        r: 2.6 + Math.random()*1.1
      });
    }
  }
  seed();

  function bandPx(){ return bandX * W; }

  function step(dt){
    // ease frame parameter
    f += (fTarget - f) * Math.min(1, dt*3.2);
    if(Math.abs(f-fTarget) < 0.001) f = fTarget;

    // band motion: ground -> drifts left at a; wave -> pulled to centre & frozen
    const bandVel = -aPix * (1 - f);           // px/s
    bandX += (bandVel * dt) / W;
    bandX += (0.5 - bandX) * f * 2.4 * dt;      // gentle centring in wave frame
    if(bandX < -0.05) bandX += 1.1;             // wrap while drifting (ground)
    if(bandX > 1.05)  bandX -= 1.1;

    const bx = bandX;
    // molecule bulk motion (fraction/s). Rightward bulk = f*a. Compressed side slows.
    for(const m of mols){
      let vx = f * aPix;                        // appears as we enter wave frame
      const compressed = m.x > bx;             // right of band = behind wave (compressed)
      if(compressed) vx -= f * aPix * daFrac;  // a -> a+da (da<0): downstream slower
      m.x += (vx * dt) / W;
      if(m.x > 1.02) m.x -= 1.04;              // recycle upstream (fresh undisturbed gas)
      if(m.x < -0.02) m.x += 1.04;
      m.ph += m.pv * dt * 4.0;                  // thermal jiggle
    }
  }

  function drawArrow(x1,y,x2,color,label,dashed){
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.setLineDash(dashed?[6,5]:[]);
    ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
    ctx.setLineDash([]);
    const dir = Math.sign(x2-x1);
    ctx.beginPath();
    ctx.moveTo(x2,y); ctx.lineTo(x2-dir*11,y-6); ctx.lineTo(x2-dir*11,y+6);
    ctx.closePath(); ctx.fill();
    if(label){
      ctx.font = 'italic 700 18px Calibri,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(label, (x1+x2)/2, y-9);
    }
  }


  function render(){
    const bx = bandPx();
    ctx.clearRect(0,0,W,H);

    // region backgrounds
    ctx.fillStyle = COL.ice;   ctx.fillRect(0,0,bx,H);
    ctx.fillStyle = COL.cream; ctx.fillRect(bx,0,W-bx,H);

    // molecules (drawn first; labels sit on top with backing panels)
    for(const m of mols){
      const compressed = m.x > bandX;
      const px = m.x*W;
      const py = m.y*H + Math.sin(m.ph)*m.amp;
      ctx.beginPath();
      ctx.arc(px, py, m.r, 0, Math.PI*2);
      ctx.fillStyle = compressed ? COL.molC : COL.mol;
      ctx.globalAlpha = compressed ? 0.95 : 0.78;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // band (wave front)
    ctx.strokeStyle = COL.navy; ctx.lineWidth = 3;
    ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.moveTo(bx, 8); ctx.lineTo(bx, H-40); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = COL.navy; ctx.textAlign='center';
    ctx.font='italic 14px Calibri,sans-serif';
    ctx.fillText('sound wave', bx, H-30);

    // region labels (drawn on top of molecules; orange values contrast with navy dots)
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font='700 13px Calibri,sans-serif'; ctx.fillStyle=COL.navy;
    ctx.fillText('AHEAD · region 1  (undisturbed)', 18, 14);
    ctx.font='italic 700 26px "Bookman Old Style",Georgia,serif';
    ctx.fillStyle=COL.orange;
    ctx.fillText('p', 24, 44); ctx.fillText('ρ', 24, 78); ctx.fillText('T', 24, 112);

    ctx.textAlign='right';
    ctx.font='700 13px Calibri,sans-serif'; ctx.fillStyle=COL.navy;
    ctx.fillText('BEHIND · region 2  (slightly changed)', W-18, 14);
    ctx.font='italic 700 26px "Bookman Old Style",Georgia,serif';
    ctx.fillStyle=COL.orange;
    ctx.fillText('p + dp', W-24, 44);
    ctx.fillText('ρ + dρ', W-24, 78);
    ctx.fillText('T + dT', W-24, 112);
    ctx.textAlign='left';

    // velocity arrows depend on frame
    const midY = H*0.5;
    // wave-frame gas flow (fades in with f)
    if(f > 0.02){
      ctx.globalAlpha = f;
      drawArrow(bx-150, midY, bx-40, COL.green, 'a', false);        // inflow at a
      const outLen = 110*(1-daFrac);
      drawArrow(bx+40, midY, bx+40+outLen, COL.green, 'a + da', false); // slower out
      ctx.globalAlpha = 1;
    }
    // ground-frame wave velocity (fades out with f)
    if(f < 0.98){
      ctx.globalAlpha = 1-f;
      drawArrow(bx+55, H*0.80, bx-55, COL.orange, 'a', false); // wave travels left
      ctx.font='italic 13px Calibri,sans-serif'; ctx.fillStyle=COL.orange;
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('wave moves left', bx, H*0.80+8);
      ctx.globalAlpha = 1;
    }
  }

  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    step(dt); render();
    requestAnimationFrame(loop);
  }

  // --- UI copy per frame ---
  const COPY = {
    ground:{
      name:'Ground frame',
      sub:'You stand still — <b>the wave travels left at speed a</b>; the gas is essentially at rest (thermal motion only).',
      take:'The wave moves, the gas does not. This is <b>unsteady</b>: the front sweeps through space, so the state at a fixed point changes in time — a fixed control volume cannot be applied directly.',
      btn:'Switch to wave frame ▶'
    },
    wave:{
      name:'Wave frame',
      sub:'You ride the wave — <b>the wave is stationary; gas streams in from the left at a</b> and leaves at a+da after crossing the front (da&lt;0).',
      take:'Add a rightward velocity a to everything: the wave is caught up with and frozen → <b>steady flow</b>. That is what lets us apply steady continuity + Euler to a fixed control volume across the front, giving a²=dp/dρ. The slowdown a→a+da (from dp≠0) is the result we solve for — slower + same flux → denser (continuity), not the reason analysis is possible.',
      btn:'◀ Switch back to ground frame'
    }
  };
  function applyCopy(){
    const c = fTarget===1 ? COPY.wave : COPY.ground;
    frameName.textContent = c.name;
    subtitle.innerHTML = c.sub;
    takeaway.innerHTML = c.take;
    btn.textContent = c.btn;
  }
  btn.addEventListener('click', ()=>{ fTarget = fTarget===0 ? 1 : 0; applyCopy(); });

  window.addEventListener('resize', resize);
  resize(); applyCopy();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
